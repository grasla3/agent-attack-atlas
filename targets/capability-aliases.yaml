  poisonedrag-rag-pipeline:
    _evidence_basis: 直读 sleeepeer/PoisonedRAG（main）的源码符号，逐条**回源校验**（脚本会因上游改动而构建失败）： src/contriever_src/beir_utils.py:85 def encode_corpus / :46 def encode_queries； src/prompts.py:8 def wrap_prompt(question, context；src/models/GPT.py:14 def query(self, msg)； 调用处 main.py:129-130 / :166-168（wrap_prompt(...) → llm.query(query_prompt)）。 画像重建脚本：results/README.md
    capabilities:
    - id: knowledge_corpus_retrieval
      native: BEIR 语料（默认 nq，可选 hotpotqa / msmarco）+ 稠密检索器；查询经编码后在语料上检索
      source: src/contriever_src/beir_utils.py:46 encode_queries / :85 encode_corpus；main.py:56/:58 load_beir_datasets
      reason: 目标**结构性地拥有**一个可被写入的语料与一套检索器 —— 这正是 T01 的 knowledge_retrieve 所指的那一面。**与 InjecAgent 那处不同：这里是事实，不是判断** （对照 D23：那里是"网页检索算不算语料面"，此处是"确实有语料"）。
      actions:
      - knowledge_retrieve
      - encode_queries
    - id: corpus_ingest
      native: 文档编码入库（攻击者的投毒写入面）
      source: src/contriever_src/beir_utils.py:85 encode_corpus
      reason: 目标确有文档写入面
      actions:
      - doc_ingest
    - id: answer_generation
      native: 把检索到的上下文拼进提示词后交给生成模型作答
      source: src/prompts.py:8 wrap_prompt；src/models/GPT.py:14 query；main.py:130/:168
      reason: 目标确有生成回答这一步
      actions:
      - answer_generate
      - response_generate
      - generation_complete
      - assistant_turn
      - instruction_follow
    - id: user_question
      native: 管线逐条接收用户问题（main.py 的查询循环）
      source: main.py:98 target_queries / :121-129 question = ...['question']
      reason: 入口是用户提问
      actions:
      - user_turn
