    - id: tool_output_ingestion
      native: 工具执行结果作为 Observation 回灌进上下文
      source: 'src/prompts/agent_prompts.py:33（Observation: the execution result of the tool）/ :18（Scratchpad 追踪 previous tool calls and tool execution outputs）'
      reason: 工具返回值回到模型上下文——这正是间接提示注入的入口面
      actions:
      - tool_return
      - tool_return_read
      - read_tool_result
    - id: system_prompt_in_context
      native: agent 有系统提示词（SYS_PROMPT）
      source: 'src/prompts/agent_prompts.py:136（"hwchase17_react": (SYS_PROMPT, USER_PROMPT_SIMPLE)）'
      reason: 目标确有系统提示词这一层；能否读出是测量问题，不是适用性问题
      actions:
      - read_system_prompt
    - id: reasoning_step
      native: ReAct 的 Thought 步：模型先推理再决定下一步动作
      source: 'src/prompts/agent_prompts.py:30（Thought: your reasoning for determining the next action）'
      reason: 模型确有一步显式推理；这一步问的是'攻击是否依赖一次规划/推理输出'
      actions:
      - plan_action
    - id: code_execution
      native: Terminal 工具执行终端命令
      source: 'targets/injecagent-toolkits.json 的 TerminalExecute（data/tools.json: toolkit=Terminal, tool=Execute）'
