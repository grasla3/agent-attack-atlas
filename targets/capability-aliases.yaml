version: capability-aliases-v2
generated: 2026-10-02（v2：2026-10-03 补 banking / travel 两段）
targets:
  agentdojo-workspace:
    _evidence_basis: 直读本机安装的 agentdojo==0.1.35（wheel sha256 见 requirements-target.txt）
    capabilities:
    - id: user_turn
      native: 适配器把用户消息放进对话并调用 Pipeline.query
      source: harness/adapters/agentdojo_workspace.py:inject；agentdojo/agent_pipeline/basic_elements.py InitQuery
      reason: 目标的入口就是用户轮次；卡的这一步问的是'攻击能否经由用户发言进入'
      actions:
      - user_turn
    - id: assistant_response
      native: 模型生成一条 assistant 消息（内容块列表）
      source: agentdojo/agent_pipeline/basic_elements.py；harness/adapters/agentdojo_workspace.py:_extract_assistant_text
      reason: 任何一轮对话都会产生助手回复；卡的这一步问的是'攻击是否需要一个可读的助手输出'
      actions:
      - response_generate
      - answer_generate
      - generation_complete
      - assistant_turn
    - id: instruction_following
      native: agent 读取指令并据此行动（工具调用循环）
      source: agentdojo/agent_pipeline/agent_pipeline.py:AgentPipeline.from_config（tools_loop）
      reason: 被评测对象就是'照着指令做事的 agent'；这一步是它的定义性质
      actions:
      - instruction_follow
      - task_execute
    - id: tool_invocation
      native: FunctionsRuntime 执行模型给出的 tool_calls
      source: agentdojo/functions_runtime.py:41 FunctionCall / :68 Function；agent_pipeline/tool_execution.py:46 ToolsExecutor / :74 for tool_call in messages[-1]['tool_calls']
      reason: 目标确有工具调用执行面；这一步问的是'攻击路径里有没有一次工具调用'
      actions:
      - tool_call
      - tool_invoke
      - invoke_tool
      - select_tool
    - id: tool_schema_exposure
      native: 工具 schema 作为 tools 参数交给模型
      source: agentdojo/agent_pipeline/llms/openai_llm.py:134 _function_to_openai / :160 tools=tools
      reason: 模型能看到每个工具的名字、描述与参数 schema；这一步问的是'工具元数据是否可见'
      actions:
      - read_tool_metadata
      - tool_list
    - id: tool_output_ingestion
      native: 工具输出回灌进对话循环（不可信内容入口）
      source: agentdojo/agent_pipeline/tool_execution.py:118 ToolsExecutionLoop / tool_result_to_str
      reason: 工具返回值会作为消息回到模型上下文；这一步问的是'是否存在工具返回面'
      actions:
      - tool_return
      - tool_return_read
      - read_tool_result
    - id: system_prompt_in_context
      native: 系统提示词进入模型上下文（SystemMessage 组件）
      source: agentdojo/agent_pipeline/basic_elements.py:28 SystemMessage
      reason: 目标确有系统提示词这一层；**能不能把它读出来是 T06 的测量问题，不是适用性问题**
      actions:
      - read_system_prompt
    - id: state_changing_tools
      native: 24 个工具里有可写工具（send_email / create_file / create_calendar_event …）
      source: targets/agentdojo-workspace.json 的 tools 清单（直读 default_suites/v1/workspace/task_suite.py）
      reason: 逐个工具名与目标工具清单**逐字一致**的，直接算命中，不算别名
      actions:
      - send_email
      - delete_email
      - create_file
      - delete_file
      - share_file
      - append_to_file
      - create_calendar_event
      - cancel_calendar_event
      - reschedule_calendar_event
      - add_calendar_event_participants
    excluded:
    - family: 检索语料 / 向量库
      actions:
      - knowledge_retrieve
      - retrieve_document
      - rag_query
      reason: 包内以 5 条正则直查（retriev|vector_store|embedding|long_term_memory|authoriz），命中的都是'检索文件'的 docstring；未见检索语料或向量库面
    - family: 长期记忆 / 跨会话状态
      actions:
      - memory_retrieve
      - memory_write
      - memory_read
      reason: 同上直查未见长期记忆面；环境是 per-task 构造、每 trial 重建
    - family: 授权判定
      actions:
      - authz_decide
      - authorization_check
      reason: 同上直查未见授权面；工具调用不做授权判定（docs/benchmark-matrix.md §3.2 已认定'没有 authorization 证据层'）
    - family: 工具注册 / 动态工具集
      actions:
      - register_tool
      - abort_tool_registration
      - rewrite_tool_descriptor
      - crawl_server_metadata
      - read_agent_card
      - read_skill_metadata
      reason: 工具集在 pipeline 构造时固定（FunctionsRuntime(suite.tools)），运行时无注册/改写端点
    - family: 审计日志 / 服务端回读
      actions:
      - server_log_readback
      - log_interpret
      reason: 环境内无审计日志面；targets/agentdojo-workspace.json 的 receipt_supported=false
    - family: 物理/具身动作
      actions:
      - execute_manipulation
      - decode_action_chunk
      - plan_action
      - read_lidar_state
      reason: 目标域是邮件/日程/云盘，无执行器与传感器面
    - family: 模型训练 / 权重
      actions:
      - load_model
      reason: 目标只经 API 调用模型，无训练与权重面
    _unresolved:
    - actions:
      - code_generate
      - plan_generate
      - decision_generate
      - reasoning_trace_generate
      - orchestrate_task
      - web_fetch
      - outbound_request
      - execute_command
      - doc_ingest
      - answer_with_context
      - guardrail_invoke
      reason: 名称有歧义或需要额外前提（如代码执行、规划器、网络、护栏模型），**本轮未取得直读依据，故不别名**。按 E3：这是'本次未核'，不是'目标没有'。
  injecagent-toolkits:
