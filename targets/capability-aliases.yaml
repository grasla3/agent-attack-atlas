      - tool_invoke
      - invoke_tool
      - select_tool
      - read_tool_metadata
      - tool_list
      - register_tool
      - abort_tool_registration
      - rewrite_tool_descriptor
      - crawl_server_metadata
      - read_agent_card
      - read_skill_metadata
      - tool_return
      - tool_return_read
      - read_tool_result
      - plan_action
      reason: 管线的三个组件（检索器 / 拼提示 / 生成）是**固定调用**的，模型没有"选择并调用工具"这一步： 没有 tool-calling 循环、没有工具 schema 暴露、没有工具返回值回灌。 故本族一律不别名 —— 这也是 tool 维仍记 2 档（"已知工具"而非"任意工具"）的原因。
    - family: 检索以外的一切外部取数
