case_id: T08
distinctness_evidence:
  axis: mechanism_first_step
  ref: LIT-B-04
  locator: >-
    B-04 §3–§4：机制首步是**以良性查询迭代覆盖知识库的主题分布**（锚点 + 主题相似度阈值 + 类间不相似度约束），
    全程**不含注入、不含越狱、不含触发器**；判据是"抽出的替代库在同类任务上逼近原库"。
    与 T08 其余方法的机制首步均不同：其余方法或注入载荷（B-145/B-147/B-149/B-151/B-154/B-164）、
    或优化查询以最大化散度（B-148）、或自适应查询记忆（B-153）、或被动观测工具调用（B-T08-02/B-T08-03/B-T08-04）。
    这是本类唯一的"**不注入任何东西、靠查询分布覆盖把库搬走**"的构造。
  value: LIT-B-04
