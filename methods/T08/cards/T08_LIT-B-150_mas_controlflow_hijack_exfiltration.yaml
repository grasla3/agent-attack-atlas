distinctness_evidence:
  axis: mechanism_first_step
  ref: LIT-B-150
  locator: >-
    B-150 §4：机制首步是**改写多智能体编排流**（伪造错误信息做控制流劫持）。
    **本卡取【数据外泄臂】**：B-150 §3.2 把恶意功能列为两条，其一为 "Exfiltrating data about the user."；
    该臂有**自己的表与列** —— B-150 **Table 5** 的 `Local Exfil.` / `Web Exfil.` 两列
    （CrewAI：68%|37%|62%|27% · 70%|65%|30%|18% · 30%|23%|17%|18% · 48%|42%|43%|3%），
    与 RCE 臂的列**并列而非同一列**，故两臂是**两种独立构造**，不是同一实验的两种配置。
    **另一臂（RCE）**：B-150 **Table 2**（Web Redirect）/ **Table 3**（Local File）/ **Table 4**（Web Single · Web Image），
    终点为任意代码执行，本卡不收；其类归属见 ROADMAP.md A-4。
    一句话判据复核：两臂的攻击**算法不同**（劫持编排流→执行载荷 vs 劫持编排流→把用户数据交给攻击者工具），故允许拆臂。
