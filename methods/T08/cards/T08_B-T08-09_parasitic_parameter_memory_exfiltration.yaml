case_id: T08
distinctness_evidence:
  axis: mechanism_first_step
  ref: LIT-B-T08-09
  locator: >-
    B-T08-09 §5.1 + Figure 2：机制首步是**在恶意 MCP 服务器**自己的工具 API 里声明一个多余参数
    （原文示例参数名 `task_history`），并把它解释为 session tracking / audit logging 一类**技术前置步骤**，
    使 agent 在正常调用该工具时**主动把整段会话记忆当作该参数的值传出去**；
    攻击者的目标是**跨 MCP 读取**——从别的 MCP 经手的数据里重建用户操作史。
    与 T08 其余方法的机制首步均不同：其余或以载荷注入、或优化查询、或被动观测日志；
    ⚠ 与本类 B-T08-03（Claw in Plain Sight）**最接近**：两者都属「把外泄包装成必需」，
    但 B-T08-03 的载体是**上下文里的 memo 措辞**（说服模型把已可用属性写进本来合法的参数），
    B-T08-03 的对照也明确其判据止于**生成的参数**；本卡的载体是**服务器自己 API 的参数 schema**（协议层声明），
    且判据是攻击者服务端**真实收到**会话记忆。**两者是否该合并，见 ROADMAP.md C-7（已登记，不自行决定）。**
