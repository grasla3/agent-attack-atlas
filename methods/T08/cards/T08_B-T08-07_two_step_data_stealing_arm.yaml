  rollback: 从运行前的只读环境快照恢复
source_grade: A
numeric_evidence: original_table
source_refs:
- B-159 Table 2（17 个 user case × 62 个 attacker case = 1,054 个测试用例；其中 Direct harm 30 / Data stealing 32）
- B-159 Table 3（base 与 enhanced 两档按模型分列，Direct Harm 与 Data Stealing 分开报：GPT-4 `14.7 32.7 97.7 31.9 23.6 | 33.3 61.0 98.2 59.9 47.0`）
- B-159 Table 4（两类攻击的对比：Direct Harm `AC. 0.18 / UC. 0.28 / p=5×10−5`；Data Stealing `AC. 0.20 / UC. 0.31 / p=0.0001`）
- B-159 Table 7/8/9（ASR-valid 与 ASR-all 两口径；Table 9 按攻击类型分列）
- B-159 Table 11/12（长 ReAct 提示 vs 短 Langchain 提示的鲁棒性对比）与微调档（GPT-3.5/GPT-4 fine-tuned 的 Total 3.8 / 6.6）
case_id: T08
distinctness_evidence:
  axis: mechanism_first_step
  ref: LIT-B-159
  locator: >-
    B-159 §2.1–§2.2：本卡取该文的 **data stealing 臂**（另一个臂 direct harm 的终点是"用工具直接损害用户"——
    转账、开门等状态改变，属 **T04**，本卡不收，见 secondary_assets 与 docs/method-capacity-audit.md 的跨类表）。
    机制首步是**在用户工具返回的可改字段里替换占位符**，植入"先取数、再发信"的**两跳**指令；
    原文为该臂单独定义（§2.1 两类攻击并列陈述）、单独建 544 个用例、并在 Table 3/4/9 中**单独成列**报数
    ⇒ 与 direct harm 臂是**两种独立构造**，不是同一实验的两种配置（按 ruling-c4-vs-c11 §三，C11 优先，允许拆臂）。
    与 T08 其余方法亦不同：其余多为单跳外泄（一次工具调用即带出数据），本卡要求**取数与外发两跳均成功**。
  value: LIT-B-159
