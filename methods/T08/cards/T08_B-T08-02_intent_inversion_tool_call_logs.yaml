provenance_components:
  mechanism:
    ref: LIT-B-04X
    source: "新收 · arXiv 2512.14166v2 · 「IntentMiner: Intent Inversion Attack via Tool Call Analysis in the Model Context Protocol」"
  vector:
    ref: 工具返回
    source: docs/domain-and-literature.md §2（Kim 2026 §4.1 V1–V6）；B-T08-02 §2：攻击面是第三方 MCP 服务器自身的服务端日志
  technique:
    ref: 自动生成
    source: docs/domain-and-literature.md §2.4（越狱六类方法学，域地图行 16）——意图由层次化信息隔离 + 逐步日志分析算法重建
  transform: null
