distinctness_evidence:
  axis: mechanism_first_step
  ref: LIT-B-04X
  locator: >-
    B-T08-02 §3：机制首步是**对第三方 MCP 服务器已记录的逐步工具调用做层次化信息隔离与关联分析**，
    以反推用户意图；**攻击者不写入、不注入、不改变任何被观测对象的行为**——这是本类唯一的**纯被动观测型**构造。
    与 T08 其余方法的机制首步均不同：其余或注入载荷、或优化查询、或自适应探测、或供给后门模型。
