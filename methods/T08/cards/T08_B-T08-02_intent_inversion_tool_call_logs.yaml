method_id: T08.B-T08-02.intent_inversion_tool_call_logs
title: 意图反演：半诚实的第三方 MCP 服务器只分析逐步工具调用日志，就反推出用户原始意图（全程不注入任何载荷）
surface_layer: L3.2
