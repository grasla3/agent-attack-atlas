case_id: T08
distinctness_evidence:
  axis: mechanism_first_step
  ref: LIT-B-T08-06
  locator: >-
    B-T08-06 §3.2 + Figure 2：机制首步是**经一次不可信工具调用把休眠载荷种进长期记忆**（Stage 1 Injection），
    再在**用户日后谈及敏感话题**时才激活并把该轮消息发给攻击者（Stage 2 Activation）——
    触发条件绑定在**用户话题**上，与 T08 其余持久化方法不同：
    B-155（SPORE）靠**对抗上下文/再激活载荷**在后续会话持续抽取，
    B-160（SpAIware）靠**图片渲染**把后续对话带走，
    本卡靠**话题语义**触发且外泄汇是**发信类工具**。
    一句话判据复核：换掉之后攻击的**算法**变了（话题触发的两阶段跨会话载荷 vs 再激活载荷抽取 vs 图片渲染），故计为独立方法。
