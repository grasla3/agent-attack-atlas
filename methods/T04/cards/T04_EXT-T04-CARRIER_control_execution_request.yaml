    source: 本项目自建（2026-10-04）：修根因第 3 条"构造没有承载物"。依据是**实测**——本类原 25 个 request 取值全为指代型（"把它要求的那个移动放进动作列表"），而指代对象不在上下文里，模型无从执行（见 results/README.md 与 t04-paper-based-decision 同源记录）。本卡把动作与参数写进载荷本身。
  vector:
    ref: 用户输入
    source: 卡上 carrier=task_context；载荷随任务一起抵达 agent（harness/payloads.py 的 CARRIERS 表）
