    source: 供应链与模块投毒（非推理期扰动）：攻击者把一个外部后门模块 Ω 插入模块化策略流水线。Ω 接收相机图像 I 与 LLM 规划器下传的物体文本 Tv，当常见物体触发器出现时改写该物体文本（原文称「替换关系」），使原生 VLM 感知模块定位到错误物体、动作模块执行攻击者指定的动作序列；无触发器时保持「中性关系」。触发器为自然物体（默认黄色 CD；细粒度另有蓝块与纹理笔）
