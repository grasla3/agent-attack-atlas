  mechanism:
    ref: LIT-B-T04-01A
    source: 攻击者在自己机器上部署一个被武器化的**替身 LLM**（仿真中用 Llama-3.1-8B），给它高层恶意意图与环境上下文，让它把意图**分解成一串参数化原子动作**——每一步单独看都良性（例如「炸掉用户手机」→ find(phone) → pick(phone) → move(oven) → stretch()）。命令净化把显式物体名换成隐式共指（「put it into the oven」）。最终动作级提示**单发**提交给受害方，不对受害方试错
  vector:
