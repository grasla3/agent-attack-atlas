  reader: audit_integrity
  expected_postcondition: 卸载 log-interceptor 后重放同一攻击轨迹，取证相关系统调用重新出现在日志中
  rollback: 卸载内核模块、恢复 kauditd 默认配置后重放同一轨迹
execution:
  mode: script_hook
  script: methods/T02/scripts/T02_AUD-PRECOMMIT-SNATCH_precommit_event_snatching.py
  args:
